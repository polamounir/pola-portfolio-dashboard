<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E73F1E" />
      <stop offset="50%" stop-color="#FB6C00" />
      <stop offset="100%" stop-color="#F9B637" />
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#E73F1E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle with Brand Gradient and Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brand-grad)" filter="url(#glow)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="url(#stroke-grad)" stroke-width="1.5" />

  <!-- Bold Modern Monogram "P" -->
  <path
    d="M21 16 H33.5 C39.8 16 44.5 20.2 44.5 26.2 C44.5 32.2 39.8 36.4 33.5 36.4 H28 V48 H21 V16 Z M28 22.2 V30.2 H33 C36.2 30.2 38 28.7 38 26.2 C38 23.7 36.2 22.2 33 22.2 H28 Z"
    fill="#FFFFFF"
  />

  <!-- Subtle admin dashboard indicator pip -->
  <circle cx="43" cy="46" r="3.2" fill="#FFFFFF" fill-opacity="0.95" />
</svg>